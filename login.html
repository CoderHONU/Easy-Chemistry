<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Easy Chemistry by S.P. Sir</title>
    <link rel="icon" type="image/svg+xml" href="static/images/beaker.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg:#0a0e1a; --bg2:#0f1628;
            --glass:rgba(255,255,255,0.05);
            --text:#fff; --text2:#b8c1d4;
            --cyan:#00d4ff; --blue:#007acc;
            --border:rgba(255,255,255,0.1);
            --error:#ff4d6d; --success:#00d4a0;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;}

        .bg-canvas{position:fixed;inset:0;z-index:0;
            background:radial-gradient(ellipse at 20% 50%,rgba(0,212,255,0.05) 0%,transparent 60%),
                       radial-gradient(ellipse at 80% 20%,rgba(0,122,204,0.07) 0%,transparent 50%),
                       linear-gradient(135deg,#0a0e1a 0%,#0d1529 100%);}
        .grid-overlay{position:fixed;inset:0;z-index:0;
            background-image:linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),
                             linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
            background-size:60px 60px;}
        .orb{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;}
        .orb-1{width:400px;height:400px;background:rgba(0,212,255,0.06);top:-100px;left:-100px;animation:flt 8s ease-in-out infinite;}
        .orb-2{width:300px;height:300px;background:rgba(0,122,204,0.08);bottom:-80px;right:-80px;animation:flt 10s ease-in-out infinite reverse;}
        @keyframes flt{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}

        /* Card */
        .wrapper{position:relative;z-index:1;width:100%;max-width:440px;padding:20px;}
        .card{background:rgba(15,22,40,0.92);border:1px solid var(--border);border-radius:24px;padding:44px 40px;
              backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05);
              opacity:0;transform:translateY(28px);}

        /* Logo */
        .logo{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:700;color:var(--cyan);
              margin-bottom:28px;text-decoration:none;}
        .logo svg{width:34px;height:34px;flex-shrink:0;}

        /* Heading */
        h1{font-size:1.85rem;font-weight:800;margin-bottom:4px;letter-spacing:-0.5px;}
        .sub{color:var(--text2);font-size:0.92rem;margin-bottom:28px;}

        /* Tabs */
        .tabs{display:flex;gap:4px;background:var(--glass);border-radius:12px;padding:4px;
              margin-bottom:24px;border:1px solid var(--border);}
        .tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text2);
             font-size:0.88rem;font-weight:500;border-radius:8px;cursor:pointer;
             transition:all 0.25s;font-family:'Inter',sans-serif;}
        .tab.active{background:var(--cyan);color:#0a0e1a;font-weight:700;box-shadow:0 4px 12px rgba(0,212,255,0.3);}

        /* Alert */
        .alert{padding:11px 15px;border-radius:10px;font-size:0.85rem;margin-bottom:18px;
               display:none;align-items:center;gap:8px;}
        .alert.error{background:rgba(255,77,109,0.12);border:1px solid rgba(255,77,109,0.3);color:#ff6b85;display:flex;}
        .alert.success{background:rgba(0,212,160,0.12);border:1px solid rgba(0,212,160,0.3);color:#00d4a0;display:flex;}

        .form-inner{padding-top:0;}
        .form-group{margin-bottom:16px;}
        label{display:block;font-size:0.83rem;color:var(--text2);margin-bottom:7px;font-weight:500;}

        input[type="email"],input[type="password"],input[type="text"]{
            width:100%;padding:13px 16px;
            background:rgba(255,255,255,0.04);border:1px solid var(--border);
            border-radius:12px;color:var(--text);
            font-size:0.92rem;font-family:'Inter',sans-serif;
            transition:all 0.25s;outline:none;
        }
        input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1);background:rgba(0,212,255,0.03);}
        input::placeholder{color:rgba(184,193,212,0.45);}

        /* password eye */
        .pw-wrap{position:relative;}
        .pw-wrap input{padding-right:46px;}
        .eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;
                 cursor:pointer;color:var(--text2);font-size:0.95rem;padding:4px;line-height:1;transition:color 0.2s;}
        .eye-btn:hover{color:var(--cyan);}

        .forgot{display:block;text-align:right;font-size:0.8rem;color:var(--cyan);text-decoration:none;margin-top:5px;}
        .forgot:hover{opacity:0.75;}

        /* strength */
        .strength-bar{height:3px;border-radius:2px;margin-top:7px;background:var(--border);overflow:hidden;display:none;}
        .strength-fill{height:100%;border-radius:2px;transition:all 0.4s;width:0;}
        .strength-text{font-size:0.72rem;margin-top:4px;display:none;}

        /* ── Submit btn ── */
        .btn-submit{
            width:100%;padding:14px;margin-top:4px;
            background:linear-gradient(135deg,var(--cyan),var(--blue));
            border:none;border-radius:12px;color:#fff;
            font-size:0.97rem;font-weight:700;cursor:pointer;
            transition:all 0.25s;font-family:'Inter',sans-serif;
            display:flex;align-items:center;justify-content:center;gap:8px;
        }
        .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,212,255,0.4);}
        .btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
        .spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;
                 border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .btn-submit.loading .btn-text{display:none;}
        .btn-submit.loading .spinner{display:block;}

        .back{text-align:center;margin-top:22px;font-size:0.85rem;color:var(--text2);}
        .back a{color:var(--cyan);text-decoration:none;font-weight:500;}
        .back a:hover{text-decoration:underline;}

        @media(max-width:480px){.card{padding:32px 22px;}h1{font-size:1.6rem;}}
    </style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="grid-overlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">
<div class="card" id="card">

    <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="none" stroke="#00d4ff" stroke-width="2"/>
            <circle cx="20" cy="20" r="10" fill="#00d4ff"/>
            <circle cx="28" cy="12" r="2" fill="white"/>
            <circle cx="12" cy="28" r="2" fill="white"/>
        </svg>
        Easy Chemistry
    </a>

    <h1>Welcome 👋</h1>
    <p class="sub">Sign in or create your student account</p>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" id="tabLogin"    onclick="switchTab('login')">Sign In</button>
        <button class="tab"        id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Alert -->
    <div class="alert" id="alertBox">
        <span id="alertIcon">⚠️</span>
        <span id="alertMsg"></span>
    </div>

    <!-- ══════════════════════════════════════
         SIGN IN PANEL
    ══════════════════════════════════════ -->
    <div id="loginPanel" class="panel-wrap" style="display:block;">

        <!-- Email form -->
        <div id="loginEmailForm">
            <div class="form-inner">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="student@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password">
                        <button class="eye-btn" type="button" onclick="togglePw('loginPassword',this)">👁️</button>
                    </div>
                    <a href="#" class="forgot" onclick="handleForgotPassword(event)">Forgot password?</a>
                </div>
                <button class="btn-submit" id="loginBtn" onclick="handleLogin()">
                    <span class="btn-text">Sign In →</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>

    </div>

    <!-- ══════════════════════════════════════
         REGISTER PANEL
    ══════════════════════════════════════ -->
    <div id="registerPanel" class="panel-wrap" style="display:none;">

        <!-- Email form -->
        <div id="registerEmailForm">
            <div class="form-inner">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Your full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="student@example.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="regPhone" placeholder="10-digit mobile number" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="regPassword" placeholder="Min 6 characters" oninput="checkStrength(this.value)">
                        <button class="eye-btn" type="button" onclick="togglePw('regPassword',this)">👁️</button>
                    </div>
                    <div class="strength-bar" id="strengthBar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
                <button class="btn-submit" id="registerBtn" onclick="handleRegister()">
                    <span class="btn-text">Create Account →</span>
                    <div class="spinner"></div>
                </button>
            </div>
        </div>

    </div>

    <div class="back"><a href="index.html">← Back to Easy Chemistry</a></div>

</div>
</div>

<!-- ══ SUPABASE ══ -->
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const sb = createClient(
        'https://rzdhgmdogmhenejemgsc.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6ZGhnbWRvZ21oZW5lamVtZ3NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDgyMTAsImV4cCI6MjA5NTcyNDIxMH0.jhbFzMYKo45hLLf35q6tn2QXefJPQvEE-8KVXTeU7Yo'
    );
    window._sb = sb;

    // Already logged in → go to dashboard
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'dashboard.html';

    sb.auth.onAuthStateChange((_e, session) => {
        if (session) window.location.href = 'dashboard.html';
    });

    // ── Sign in ────────────────────────────────────────────────
    window.handleLogin = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const pass  = document.getElementById('loginPassword').value;
        if (!email || !pass) return showAlert('Please fill in both fields.');
        hideAlert(); setLoading('loginBtn', true);
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) { showAlert(nicErr(error.message)); setLoading('loginBtn', false); }
    };

    // ── Register ───────────────────────────────────────────────
    window.handleRegister = async function() {
        const name  = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pass  = document.getElementById('regPassword').value;
        if (!name || !email || !phone || !pass) return showAlert('Please fill in all fields.');
        if (!/^[6-9]\d{9}$/.test(phone))        return showAlert('Enter a valid 10-digit phone number.');
        if (pass.length < 6)                     return showAlert('Password must be at least 6 characters.');
        hideAlert(); setLoading('registerBtn', true);

        const { data, error } = await sb.auth.signUp({
            email, password: pass,
            options: { data: { full_name: name } }
        });
        if (error) { showAlert(nicErr(error.message)); setLoading('registerBtn', false); return; }

        if (data.user) {
            await sb.from('students').insert({ user_id: data.user.id, name, email, phone, role: 'student' });
        }
        showAlert('Account created! Signing you in...', 'success');
    };

    // ── Forgot password ────────────────────────────────────────
    window.handleForgotPassword = async function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) return showAlert('Enter your email address first.');
        const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/login.html'
        });
        if (error) showAlert(nicErr(error.message));
        else showAlert('Reset link sent! Check your inbox.', 'success');
    };

    function nicErr(msg) {
        if (msg.includes('Invalid login'))      return 'Wrong email or password.';
        if (msg.includes('already registered')) return 'This email is already registered. Sign in instead.';
        if (msg.includes('weak'))               return 'Password too weak. Use at least 6 characters.';
        if (msg.includes('valid email'))        return 'Please enter a valid email address.';
        if (msg.includes('network'))            return 'Network error. Check your connection.';
        return msg;
    }
</script>

<script>
    // Animate card in
    window.addEventListener('load', () => {
        gsap.to('#card', { duration: 0.75, opacity: 1, y: 0, ease: 'power3.out', delay: 0.1 });
    });

    // ── Tab switch ─────────────────────────────────────────────
    function switchTab(tab) {
        document.getElementById('loginPanel').style.display    = tab === 'login'    ? 'block' : 'none';
        document.getElementById('registerPanel').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('tabLogin').classList.toggle('active',    tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        hideAlert();
    }
    window.switchTab = switchTab;

    // ── Alert ──────────────────────────────────────────────────
    function showAlert(msg, type = 'error') {
        const box = document.getElementById('alertBox');
        document.getElementById('alertIcon').textContent = type === 'error' ? '⚠️' : '✅';
        document.getElementById('alertMsg').textContent  = msg;
        box.className = 'alert ' + type;
        gsap.fromTo(box, { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3 });
    }
    window.showAlert = showAlert;

    function hideAlert() { document.getElementById('alertBox').className = 'alert'; }
    window.hideAlert = hideAlert;

    function setLoading(id, on) {
        const btn = document.getElementById(id);
        btn.classList.toggle('loading', on);
        btn.disabled = on;
    }

    // ── Password helpers ───────────────────────────────────────
    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        inp.type   = inp.type === 'password' ? 'text' : 'password';
        btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
    }
    window.togglePw = togglePw;

    function checkStrength(val) {
        const bar  = document.getElementById('strengthBar');
        const fill = document.getElementById('strengthFill');
        const txt  = document.getElementById('strengthText');
        bar.style.display = fill.style.display = txt.style.display = 'block';
        let s = 0;
        if (val.length >= 6)         s++;
        if (val.length >= 10)        s++;
        if (/[A-Z]/.test(val))       s++;
        if (/[0-9]/.test(val))       s++;
        if (/[^A-Za-z0-9]/.test(val)) s++;
        const lvls = [
            { w:'20%', c:'#ff4d6d', t:'Weak' },
            { w:'40%', c:'#ff8c00', t:'Fair' },
            { w:'60%', c:'#ffd700', t:'Good' },
            { w:'80%', c:'#7bc67e', t:'Strong' },
            { w:'100%',c:'#00d4a0', t:'Very Strong' },
        ];
        const l = lvls[Math.min(s, 4)];
        fill.style.width = l.w; fill.style.background = l.c;
        txt.textContent  = l.t; txt.style.color = l.c;
    }

    // ── Enter key ──────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const loginVisible = document.getElementById('loginPanel').style.display !== 'none';
        if (loginVisible) handleLogin(); else handleRegister();
    });
</script>
</body>
</html>
